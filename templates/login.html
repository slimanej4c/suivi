<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion · Carnet Projets</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login">
<main><section class="panel" aria-labelledby="title">
<div class="panel-head"><div><h1 id="title">Carnet Projets</h1><p>Connectez-vous à votre espace privé.</p></div></div>
<form method="post" action="/connexion">
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="fields">
<label>Adresse courriel<input name="email" type="email" autocomplete="username" maxlength="254" required value="{{ email }}"></label>
<label>Mot de passe<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
</div>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<footer class="dialog-foot"><button class="primary" type="submit">Se connecter</button></footer>
</form></section></main>
</body>
</html>
